r:#aaa;font-size:12px;margin-top:20px}</style></head><body><header><div class="symbol">🪷</div><h1>INNER AWAKENING</h1><strong id="sub">అంతర మేల్కొలుపు</strong><p>Discover Your Inner Self</p></header><main><section id="home"></section><section id="meditation" class="hidden"></section><section id="videos" class="hidden"></section><section id="library" class="hidden"></section><section id="premium" class="hidden"></section><section id="experience" class="hidden"></section><section id="admin" class="hidden"></section><section id="settings" class="hidden"></section><section id="account" class="hidden"></section><footer>Demo only • No payments or accounts collected</footer></main><nav><button onclick="show('home')">⌂<br>Home</button><button onclick="show('meditation')">☼<br>Meditation</button><button onclick="show('videos')">▶<br>Videos</button><button onclick="show('library')">▤<br>Library</button><button onclick="show('settings')">⚙️<br>Settings</button></nav><script>let demoUser=JSON.parse(localStorage.getItem('ia_demo_user')||'null'),demoAdmin=false;let lang='te',page='home',seconds=600,duration=600,interval=null,videoFilter='all',uploadedVideo=null,experienceFile=null,experienceURL=null,experienceRecording=null,experienceStream=null,experienceChunks=[],experienceStart=0,experienceTick=null;const tr=(te,en)=>lang==='te'?te:en;function show(id){if(id==='admin'&&!demoAdmin){page='account';render();scrollTo(0,0);return}page=id;render();scrollTo(0,0)}function render(){document.getElementById('te').className=lang==='te'?'active':'';document.getElementById('en').className=lang==='en'?'active':'';document.getElementById('sub').textContent=tr('అంతర మేల్కొలుపు','Inner Awakening');for(const id of ['home','meditation','videos','library','premium','experience','admin','settings','account'])document.getElementById(id).classList.toggle('hidden',id!==page);document.getElementById('home').innerHTML=`<div class="hero"><h2>${tr('మీ అంతర ప్రయాణం ప్రారంభించండి','Begin your inner journey' ploadedVideo?`<div class="card"><h3>${tr('మీ వీడియో','Your video')}</h3><video controls playsinline src="${uploadedVideo}"></video><p>${tr('ఈ వీడియో మీ ఫోన్‌లోనే తెరుచుకుంటుంది; సర్వర్‌కు అప్‌లోడ్ కాదు.','This video plays locally; it is not uploaded to a server.')}</p></div>`:''}${[{id:'te',type:'free',titleTe:'ధ్యానం పరిచయం',titleEn:'Introduction to Meditation',descTe:'తెలుగు • ఉచిత వీడియో స్థానం',descEn:'Telugu • Free video slot'},{id:'te',type:'premium',titleTe:'అంతర అవగాహన',titleEn:'Inner Awareness',descTe:'తెలుగు • ప్రీమియం వీడియో స్థానం',descEn:'Telugu • Premium video slot'},{id:'en',type:'free',titleTe:'నిశ్శబ్దం యొక్క విలువ',titleEn:'The Value of Silence',descTe:'English • Free video slot',descEn:'English • Free video slot'},{id:'en',type:'premium',titleTe:'ధ్యాన ప్రయాణం',titleEn:'Meditation Journey',descTe:'English • Premium video slot',descEn:'English • Premium video slot'}].filter(v=>videoFilter==='all'||v.id===videoFilter||v.type===videoFilter).map(v=>`<div class="card" onclick="${v.type==='premium'?"show('premium')":"alert(tr('ఈ వీడియో కోసం ఇంకా కంటెంట్ జోడించాలి.','This video has not been added yet.'))"}"><span class="badge">${v.type==='premium'?'🔒 Premium':'▶ Free'} · ${v.id==='te'?'తెలుగు':'English'}</span><h3 style="margin-top:12px">${tr(v.titleTe,v.titleEn)}</h3><p>${tr(v.descTe,v.descEn)}</p></div>`).join('')}<p style="color:#9ba9ac;font-size:13px">${tr('గమనిక: ఇవి నమూనా వీడియో కార్డులు. ప్రీమియం చెల్లింపులు పనిచేయవు.','Note: These are sample video cards. Premium payments are not active.')}</p>`;document.getElementById('library').innerHTML=`<h2>${tr('జ్ఞాన భాండాగారం','Wisdom Library')}</h2><div class="card"><h3>${tr('ఈ క్షణంలో ఉండటం','Being Present')}</h3><p>${tr('మన దృష్టిని ఈ క్షణంపై ఉంచడం సాధన చేయవచ్చు.','We can practice bringing our attention to the present moment.')}</p></div><div class="card"><h3>${tr('రోజువారీ ఆలోచన','Daily Reflection')}</h3><p>${tr('ప్రశాంతత కోసం రోజులో కొంత సమయం కేటాయించండి.','Set aside a little time each day for quiet reflection.')}</p></div>`;document.getElementById('experience').innerHTML=`<h2>📹 ${tr('నా అనుభవం పంచుకోండి','Share My Experience')}</h2><div class="card"><h3>${tr('3 నిమిషాల వీడియో','3-minute video')}</h3><p>${tr('మీ ఆధ్యాత్మిక లేదా ధ్యాన అనుభవాన్ని వీడియోగా రికార్డ్ చేయండి. మీ అనుమతి లేకుండా పబ్లిక్‌గా షేర్ చేయబడదు.','Record your spiritual or meditation experience. Nothing is published without your action.')}</p><p style="color:#ffcc83">${tr('గరిష్ఠ సమయం: 03:00','Maximum length: 03:00')}</p><div id="experienceStatus" style="margin:12px 0;color:#f8cf88">${experienceRecording?tr('రికార్డింగ్ జరుగుతోంది…','Recording…'):tr('వీడియోను ఎంచుకోండి లేదా రికార్డ్ చేయండి','Choose or record a video')}</div><div id="experienceCamera"></div><button class="cta" onclick="startExperience()">🔴 ${tr('రికార్డింగ్ ప్రారంభించు','Start recording')}</button> <button class="cta" onclick="stopExperience()">⏹ ${tr('ఆపు','Stop')}</button><label class="upload">📁 ${tr('ఫోన్ కెమెరాతో వీడియో తీయండి / ఎంచుకోండి','Use phone camera / choose video')}<input type="file" accept="video/*" capture="user" onchange="selectExperience(event)" style="display:block;margin-top:10px;max-width:100%"></label><div id="experiencePreview"></div><button class="cta" onclick="submitDemo()">📨 ${tr('డెమో సమీక్షకు పంపు','Send to demo review')}</button> <button class="cta" onclick="shareExperience()">📤 ${tr('వీడియో షేర్ చేయండి','Share video')}</button><p style="font-size:13px;color:#bdc9c9">${tr('ఈ డెమోలో వీడియో సర్వర్‌కు పంపబడదు. Share బటన్‌తో మీ ఫోన్‌లోని ఇతర యాప్‌కు పంపవచ్చు. నేరుగా App Adminకు పంపే సౌకర్యం తర్వాత జోడించాలి.','This demo does not upload to a server. Share opens your phone’s sharing options; direct submission to an admin requires a backend.')}</p></div>`;refreshExperience();renderAdmin();renderAccount();document.getElementById('premium').innerHTML=`<h2>♛ Premium</h2><div class="hero"><h1>₹1,000 / 3 ${tr('నెలలు','Months')}</h1><p>${tr('ఇది నమూనా ధర మాత్రమే. నిజమైన చెల్లింపులు ఇంకా అందుబాటులో లేవు.','Sample price only. Real payments are not enabled.')}</p><button class="cta" onclick="alert('${tr('ఇది డెమో మాత్రమే. చెల్లింపు జరగదు.','Demo only. No payment will be taken.')}')">${tr('సబ్‌స్క్రిప్షన్ డెమో','Subscription Demo')}</button></div>`;document.getElementById('settings').innerHTML=`<h2>⚙️ ${tr('సెట్టింగ్స్','Settings')}</h2><p>${tr('మీ ఖాతా మరియు అదనపు విభాగాలు','Your account and more features')}</p><div class="card" onclick="show('premium')"><h3>♛ ${tr('ప్రీమియం సభ్యత్వం','Premium Membership')} →</h3><p>₹1,000 / 3 ${tr('నెలలు','Months')}</p></div><div class="card" onclick="show('experience')"><h3>📹 ${tr('నా అనుభవం పంచుకోండి','Share My Experience')} →</h3><p>${tr('3 నిమిషాల వీడియో రికార్డింగ్ మరియు షేరింగ్','3-minute video recording and sharing')}</p></div><div class="card" onclick="show('account')"><h3>👤 ${tr('యూజర్ / అడ్మిన్ లాగిన్','User / Admin Login')} →</h3><p>${tr('ఖాతా మరియు అడ్మిన్ ప్రవేశం (డెమో)','Account and admin access (demo)')}</p></div><div class="card"><h3>🌐 ${tr('భాష','Language')}</h3><p>${tr('భాష మార్చడానికి పైన తెలుగు / English ఎంచుకోండి','Use the Telugu / English selector at the top')}</p></div>`}function loginUser(){const name=document.getElementById('demoName')?.value.trim();if(!name){alert(tr('పేరు నమోదు చేయండి','Enter a name'));return}demoUser={name};localStorage.setItem('ia_demo_user',JSON.stringify(demoUser));render()}
function logoutUser(){demoUser=null;demoAdmin=false;localStorage.removeItem('ia_demo_user');render()}
function loginAdmin(){const code=document.getElementById('adminCode')?.value;if(code==='1234'){demoAdmin=true;show('admin')}else alert(tr('డెమో కోడ్ తప్పు','Incorrect demo code'))}

function renderAccount(){const e=document.getElementById('account');if(!e)return;e.innerHTML=`<h2>👤 ${tr('ఖాతా','Account')}</h2><p style="color:#ffca78">${tr('ఇది డెమో మాత్రమే. 1234 కోడ్ అందరికీ తెలిసే అవకాశం ఉంది; ఇది సురక్షిత లాగిన్ కాదు. నిజమైన లాగిన్ కోసం సర్వర్ అవసరం.','Demo only. The code 1234 is visible to anyone and is NOT secure authentication. A backend is needed for real login.')}</p>${demoUser?`<div class="card"><h3>${tr('స్వాగతం','Welcome')}, ${escapeText(demoUser.name)}</h3><button class="cta" onclick="logoutUser()">${tr('లాగ్ అవుట్','Log out')}</button></div>`:`<div class="card"><h3>${tr('యూజర్ ప్రవేశం (డెమో)','User Sign In (Demo)')}</h3><input id="demoName" placeholder="${tr('మీ పేరు','Your name')}" maxlength="40" style="width:100%;padding:13px;border-radius:10px;margin:12px 0"><button class="cta" onclick="loginUser()">${tr('కొనసాగించు','Continue')}</button></div>`}<div class="card"><h3>🛡️ ${tr('అడ్మిన్ డెమో','Admin Demo')}</h3>${demoAdmin?`<button class="cta" onclick="show('admin')">${tr('డాష్‌బోర్డ్ తెరవండి','Open dashboard')}</button> <button class="cta" onclick="logoutAdmin()">${tr('అడ్మిన్ లాగ్ అవుట్','Admin logout')}</button>`:`<p>${tr('పరీక్ష కోసం కోడ్: 1234','Test code: 1234')}</p><input id="adminCode" type="password" inputmode="numeric" placeholder="Demo PIN" style="width:100%;padding:13px;border-radius:10px;margin:12px 0"><button class="cta" onclick="loginAdmin()">${tr('అడ్మిన్ లాగిన్','Admin Login')}</button>`}</div>`}
function escapeText(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setVideoFilter(f){videoFilter=f;render()}function loadVideo(e){const f=e.target.files&&e.target.files[0];if(!f)return;if(uploadedVideo)URL.revokeObjectURL(uploadedVideo);uploadedVideo=URL.createObjectURL(f);render()}function setDuration(v){clearInterval(interval);interval=null;duration=v;seconds=v;render()}function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function toggleTimer(){if(seconds===0)seconds=duration;if(interval){clearInterval(interval);interval=null;render();return}interval=setInterval(()=>{seconds--;if(seconds<=0){clearInterval(interval);interval=null;seconds=0;alert(tr('ధ్యాన సమయం పూర్తయింది','Meditation session complete'))}const el=document.getElementById('timer');if(el)el.textContent=fmt(seconds)},1000);render()}function resetTimer(){clearInterval(interval);interval=null;seconds=duration;render()}

async function selectExperience(event){const f=event.target.files?.[0];if(!f)return;const u=URL.createObjectURL(f);const probe=document.createElement('video');probe.preload='metadata';probe.onloadedmetadata=()=>{if(!Number.isFinite(probe.duration)||probe.duration>180.5){URL.revokeObjectURL(u);alert(tr('3 నిమిషాల కంటే ఎక్కువ వీడియో అనుమతించబడదు.','Only videos up to 3 minutes are allowed.'));return}setExperienceFile(f,u)};probe.onerror=()=>{URL.revokeObjectURL(u);alert(tr('వీడియో సమయాన్ని తనిఖీ చేయలేకపోయాం.','Unable to check video duration.'))};probe.src=u}
function setExperienceFile(f,u){if(experienceURL)URL.revokeObjectURL(experienceURL);experienceFile=f;experienceURL=u;refreshExperience();experienceStatus(tr('వీడియో సిద్ధం','Video ready'))}
async function startExperience(){if(experienceRecording)return;if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){alert(tr('ఈ బ్రౌజర్‌లో నేరుగా రికార్డింగ్ పనిచేయకపోవచ్చు. కింద Camera ఎంపిక ఉపయోగించండి.','Direct recording is unavailable here. Use the camera/file option below.'));return}try{experienceStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true});const mime=['video/webm;codecs=vp8,opus','video/webm','video/mp4'].find(x=>MediaRecorder.isTypeSupported(x));experienceChunks=[];experienceRecording=new MediaRecorder(experienceStream,mime?{mimeType:mime}:undefined);const rec=experienceRecording;rec.ondataavailable=e=>{if(e.data.size)experienceChunks.push(e.data)};rec.onstop=()=>{const f=new File(experienceChunks,'my-experience.'+(rec.mimeType.includes('mp4')?'mp4':'webm'),{type:rec.mimeType||'video/webm'});setExperienceFile(f,URL.createObjectURL(f));experienceStream?.getTracks().forEach(t=>t.stop());experienceStream=null;experienceRecording=null;clearInterval(experienceTick)};rec.start(1000);experienceStart=Date.now();refreshExperience();experienceTick=setInterval(()=>{const remaining=Math.max(0,180-Math.floor((Date.now()-experienceStart)/1000));experienceStatus(tr('మిగిలిన సమయం: ','Time left: ')+String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0'));if(remaining<=0)stopExperience()},250)}catch(e){experienceStream?.getTracks().forEach(t=>t.stop());experienceStream=null;alert(tr('కెమెరా అనుమతి ఇవ్వండి లేదా కింద Camera ఎంపిక ఉపయోగించండి.','Allow camera access or use the camera option below.'))}}
function stopExperience(){if(experienceRecording&&experienceRecording.state!=='inactive')experienceRecording.stop()}
async function shareExperience(){if(!experienceFile){alert(tr('ముందుగా 3 నిమిషాలలోపు వీడియో ఎంచుకోండి.','Please select a video of up to 3 minutes first.'));return}try{if(navigator.canShare?.({files:[experienceFile]})){await navigator.share({files:[experienceFile],title:'Inner Awakening – My Experience'});return}if(navigator.share){alert(tr('ఈ ఫోన్‌లో వీడియో ఫైల్ షేరింగ్ అందుబాటులో లేదు. వీడియోను సేవ్ చేయండి.','File sharing is unavailable. Save the video instead.'))}const a=document.createElement('a');a.href=experienceURL;a.download=experienceFile.name;a.click()}catch(e){if(e.name!=='AbortError')alert(tr('షేరింగ్ విఫలమైంది.','Sharing failed.'))}}

// Demo-only review queue. No video is uploaded or stored online.
let reviewQueue=JSON.parse(localStorage.getItem('ia_review_queue')||'null')||[
{id:1,name:'Demo User 1',lang:'te',title:'ధ్యానం తర్వాత నా అనుభవం',status:'pending',sample:true},
{id:2,name:'Demo User 2',lang:'en',title:'A moment of stillness',status:'pending',sample:true}
];
function saveQueue(){localStorage.setItem('ia_review_queue',JSON.stringify(reviewQueue))}
function submitDemo(){
 if(!experienceFile){alert(tr('ముందుగా వీడియో రికార్డ్ చేయండి లేదా ఎంచుకోండి.','Please record or choose a video first.'));return}
 reviewQueue.unshift({id:Date.now(),name:'My Demo Submission',lang:lang,title:tr('నా అనుభవం','My experience'),status:'pending',sample:false});
 saveQueue();alert(tr('డెమో రివ్యూ జాబితాలో చేర్చాం. వీడియో ఎక్కడికీ అప్‌లోడ్ కాలేదు.','Added to local demo review list. Your video was not uploaded anywhere.'));show('account');
}
function updateReview(id,status){if(!demoAdmin)return;const item=reviewQueue.find(x=>x.id===id);if(item){item.status=status;saveQueue();renderAdmin()}}
function resetReviews(){if(!demoAdmin)return;if(confirm(tr('డెమో జాబితాను రీసెట్ చేయాలా?','Reset demo review list?'))){reviewQueue=[];saveQueue();renderAdmin()}}
function renderAdmin(){
 if(!demoAdmin)return;const box=document.getElementById('admin');if(!box)return;
 const labels={pending:tr('పరిశీలనలో ఉంది','Pending'),approved:tr('ఆమోదించారు','Approved'),rejected:tr('తిరస్కరించారు','Rejected')};
 box.innerHTML=`<h2>🛡️ ${tr('అడ్మిన్ డాష్‌బోర్డ్','Admin Dashboard')}</h2>
 <p style="color:#ffd18a">${tr('ఇది కేవలం మీ ఫోన్‌లో పనిచేసే నమూనా. నిజమైన అడ్మిన్ లాగిన్, వీడియో అప్‌లోడ్, యూజర్లకు ప్రచురణ ఇంకా లేవు.','Local demo only. No secure admin login, actual uploads, or publishing to users.')}</p>
 <div class="card"><h3>${tr('వీడియో సమీక్ష','Video Review')}</h3><p>${tr('మొత్తం','Total')}: ${reviewQueue.length} · ${tr('పెండింగ్','Pending')}: ${reviewQueue.filter(x=>x.status==='pending').length} · ${tr('ఆమోదం','Approved')}: ${reviewQueue.filter(x=>x.status==='approved').length}</p></div>
 ${reviewQueue.map(x=>`<div class="card"><span class="badge">${labels[x.status]}</span><h3>${x.title}</h3><p>${x.name} · ${x.lang==='te'?'తెలుగు':'English'} · ${x.sample?tr('నమూనా రికార్డు','Sample record'):tr('ఈ ఫోన్‌లో జోడించిన రికార్డు','Local demo record')}</p><p style="margin-top:9px;font-size:13px">${tr('వీడియో ప్లేబ్యాక్ అందుబాటులో లేదు; నిజమైన సర్వర్ అవసరం.','Video playback unavailable; a real backend is required.')}</p><div style="margin-top:12px"><button class="cta" onclick="updateReview(${x.id},'approved')">✓ ${tr('ఆమోదించు','Approve')}</button> <button class="cta" onclick="updateReview(${x.id},'rejected')">✕ ${tr('తిరస్కరించు','Reject')}</button></div></div>`).join('')||`<p>${tr('సమీక్షకు వీడియోలు లేవు.','No submissions to review.')}</p>`}
 <button class="cta" onclick="resetReviews()">${tr('డెమో జాబితా తొలగించు','Clear demo list')}</button>`;
}
render();</script></body></html>
